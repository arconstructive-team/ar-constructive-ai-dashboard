name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: arconstructive
  REGION: us-west2
  CHAT_SERVICE: chat-api
  # The service's own Google identity: it reads Firestore, checks Firebase sign-ins and reads
  # the Anthropic key from Secret Manager.
  CHAT_RUNTIME_SA: firebase-adminsdk-fbsvc@arconstructive.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Test
        working-directory: web
        run: |
          pnpm typecheck
          pnpm test
      - name: Build
        working-directory: web
        run: pnpm build
      - name: Sign in to Google (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@13.29.1 deploy --only hosting,firestore:rules --project arconstructive --non-interactive

  # The API (permit check, team chat assistant and site report) on Cloud Run. The Anthropic key
  # and the Google Maps Platform key go from Secret Manager straight into the service; they are
  # never in the repository or the web build.
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: api/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml
      - name: Install
        working-directory: api
        run: pnpm install --frozen-lockfile
      - name: Test
        working-directory: api
        run: |
          pnpm typecheck
          pnpm test
      - name: Sign in to Google (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push the image
        id: image
        run: |
          gcloud artifacts repositories describe dashboard --location "$REGION" --project "$PROJECT_ID" >/dev/null 2>&1 \
            || gcloud artifacts repositories create dashboard --repository-format docker --location "$REGION" --project "$PROJECT_ID"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/dashboard/$CHAT_SERVICE:${{ github.sha }}"
          docker build -t "$IMAGE" api
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloud Run
        env:
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: |
          # One team list: the same emails the web app lets in.
          ALLOWED_EMAILS=$(sed -n 's/^VITE_ALLOWED_EMAILS=//p' web/.env.production | tr -d '[:space:]')
          if [ -z "$ALLOWED_EMAILS" ]; then echo "web/.env.production has no VITE_ALLOWED_EMAILS." >&2; exit 1; fi
          ENV_VARS="^;^ALLOWED_EMAILS=$ALLOWED_EMAILS;ALLOWED_ORIGIN=https://arconstructive.web.app,https://arconstructive.firebaseapp.com;GOOGLE_CLOUD_PROJECT=$PROJECT_ID"
          # The model is a repository variable when set; else the code's default (a current Sonnet).
          if [ -n "$ANTHROPIC_MODEL" ]; then ENV_VARS="$ENV_VARS;ANTHROPIC_MODEL=$ANTHROPIC_MODEL"; fi
          # Autopo agents: the service accounts that may call chat-api with a Google identity token
          # (a repository variable when set; else the account Autopo uses), and the audiences such a
          # token must name: this service's URLs.
          AGENT_SERVICE_ACCOUNTS="${{ vars.AGENT_SERVICE_ACCOUNTS }}"
          if [ -z "$AGENT_SERVICE_ACCOUNTS" ]; then AGENT_SERVICE_ACCOUNTS="autopo@$PROJECT_ID.iam.gserviceaccount.com"; fi
          AGENT_AUDIENCES="https://chat-api-kfzvlbf5aq-wl.a.run.app"
          CURRENT_URL=$(gcloud run services describe "$CHAT_SERVICE" --region "$REGION" --project "$PROJECT_ID" --format 'value(status.url)' 2>/dev/null || true)
          if [ -n "$CURRENT_URL" ] && [ "$CURRENT_URL" != "$AGENT_AUDIENCES" ]; then AGENT_AUDIENCES="$AGENT_AUDIENCES,$CURRENT_URL"; fi
          PROJECT_NUMBER=$(gcloud projects describe "$PROJECT_ID" --format 'value(projectNumber)' 2>/dev/null || true)
          if [ -n "$PROJECT_NUMBER" ]; then AGENT_AUDIENCES="$AGENT_AUDIENCES,https://$CHAT_SERVICE-$PROJECT_NUMBER.$REGION.run.app"; fi
          ENV_VARS="$ENV_VARS;AGENT_SERVICE_ACCOUNTS=$AGENT_SERVICE_ACCOUNTS;AGENT_AUDIENCES=$AGENT_AUDIENCES;STORAGE_BUCKET=$PROJECT_ID.firebasestorage.app"
          SECRETS="ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest"
          # The agents' shared API key, for callers that cannot mint a Google identity token. Until
          # the secret exists only identity tokens and team sign-ins work.
          if gcloud secrets describe AGENT_API_KEY --project "$PROJECT_ID" >/dev/null 2>&1; then
            SECRETS="$SECRETS,AGENT_API_KEY=AGENT_API_KEY:latest"
          else
            echo "::warning::Secret AGENT_API_KEY is missing: agents must call with a Google identity token."
          fi
          # The site report's Google key (Geocoding, Street View Static, Maps Static, Solar). Until
          # the secret exists the site report uses the free public sources and shows the Google
          # steps as failed, so the deploy goes on without it and says so.
          if gcloud secrets describe GOOGLE_MAPS_API_KEY --project "$PROJECT_ID" >/dev/null 2>&1; then
            SECRETS="$SECRETS,GOOGLE_MAPS_API_KEY=GOOGLE_MAPS_API_KEY:latest"
          else
            echo "::warning::Secret GOOGLE_MAPS_API_KEY is missing: the site report has no Google geocode, images or roof data."
          fi
          gcloud run deploy "$CHAT_SERVICE" \
            --image "${{ steps.image.outputs.image }}" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --service-account "$CHAT_RUNTIME_SA" \
            --allow-unauthenticated \
            --timeout 300 \
            --memory 1Gi \
            --set-secrets "$SECRETS" \
            --set-env-vars "$ENV_VARS" \
            --quiet
      - name: Check the service answers
        run: |
          URL=$(gcloud run services describe "$CHAT_SERVICE" --region "$REGION" --project "$PROJECT_ID" --format 'value(status.url)')
          # Cloud Run answers /healthz itself (reserved path), so check /health.
          curl -fsS --retry 3 --retry-delay 5 --retry-all-errors "$URL/health"
